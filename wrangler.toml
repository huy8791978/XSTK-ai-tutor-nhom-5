name = "xstk-ai"
main = "worker/index.js"
compatibility_date = "2025-09-01"

[assets]
directory = "./public"
binding = "ASSETS"

# Logs + Issues on, Traces off — mirrors the dashboard so deploys never switch them off.
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = true
persist = true

[observability.traces]
enabled = false

[observability.issue_detection]
enabled = true

[[durable_objects.bindings]]
name = "LIMITER"
class_name = "Limiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Limiter"]

# Non-secret settings. Limits are counted per model (each has its own Google quota); set them ~10% below
# the smallest free-tier quota among the models. AI answers try GEMINI_MODELS strongest → weakest: a model that
# is out of quota or unavailable is skipped silently and the next one answers.
# GEMINI_API_KEY is a secret: pushed from GitHub Secrets by the deploy workflow, never here.
[vars]
GEMINI_MODELS = "gemini-3.8-flash,gemini-3.8-flash-lite,gemini-3.5-flash,gemini-3.5-flash-lite,gemini-2.5-flash,gemini-2.5-flash-lite"
LIMIT_RPM = "14"
LIMIT_TPM = "225000"
LIMIT_RPD = "900"
LIMIT_PER_IP_RPM = "6"
FORUM_PER_IP_RPM = "5"
# Reading answers aloud with Gemini TTS (real male/female voices). Models are tried newest → oldest: when one
# is out of quota the next one is used; when all are, the browser voice is used. Our own cap counts all of them.
GEMINI_TTS_MODELS = "gemini-3.8-flash-tts,gemini-3.8-flash-lite-tts,gemini-3.1-flash-tts-preview,gemini-2.5-flash-preview-tts"
LIMIT_TTS_RPM = "30"
LIMIT_TTS_RPD = "400"
LIMIT_TTS_PER_IP_RPM = "6"

[[durable_objects.bindings]]
name = "FORUM"
class_name = "Forum"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Forum"]
