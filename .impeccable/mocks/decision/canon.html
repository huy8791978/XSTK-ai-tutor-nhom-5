<!doctype html><html lang="vi"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}body{width:1440px;height:900px;overflow:hidden;font:15px/1.55 "Be Vietnam Pro";color:#111827;background:#F9FAFB;display:grid;grid-template-columns:240px 1fr}
aside{background:#fff;border-right:1px solid #E5E7EB;padding:24px 16px}aside b{font-size:20px;color:#4F46E5}aside a{display:block;padding:10px 12px;border-radius:8px;margin-top:6px;color:#374151}aside a.on{background:#EEF2FF;color:#4F46E5;font-weight:600}
main{padding:32px 40px}h1{font-size:28px;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:24px}
.c{background:#fff;border:1px solid #E5E7EB;border-radius:16px;padding:24px;box-shadow:0 1px 2px #0000000d}.drop{height:240px;border:2px dashed #C7D2FE;border-radius:12px;display:grid;place-items:center;color:#6B7280}
.btn{display:inline-block;margin-top:14px;margin-right:8px;padding:10px 16px;border-radius:10px;background:#4F46E5;color:#fff;font-weight:600}.btn.g{background:#EEF2FF;color:#4F46E5}
.big{font-size:56px;font-weight:700;color:#4F46E5}
</style></head><body>
<aside><b>XSTK AI</b><a class="on">Chấm bài</a><a>Luyện tập</a><a>Vấn đáp</a><a>Bản đồ tư duy</a><a>Hồ sơ</a></aside>
<main><h1>Chấm bài bằng AI</h1><div class="grid"><div class="c"><div class="drop">Tải ảnh hoặc PDF</div><span class="btn g">Chiến lược</span><span class="btn">Chấm điểm</span><span class="btn g">Lời giải</span></div>
<div class="c"><p>Điểm</p><div class="big">7.5</div><p>Sai tính toán ở bước 3. Nên kiểm tra lại tổng xác suất.</p></div></div></main>
</body></html>
